name: Initialize Project Structure

on:
  workflow_dispatch:

jobs:
  init-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CLAUDE_ACCESS }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Create project structure
        run: |
          mkdir -p src/anthropic_claude_contributions tests .github/workflows .github/ISSUE_TEMPLATE

          cat > pyproject.toml <<'EOF'
          [build-system]
          requires = ["setuptools>=68", "wheel"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "anthropic-claude-contributions"
          version = "0.1.0"
          description = "Open-source utilities and examples for building Claude-powered Python applications."
          readme = "README.md"
          requires-python = ">=3.10"
          license = { text = "Apache-2.0" }
          authors = [{ name = "azami-id" }]
          keywords = ["anthropic", "claude", "llm", "python", "ai", "open-source"]
          classifiers = [
            "Development Status :: 3 - Alpha",
            "Intended Audience :: Developers",
            "License :: OSI Approved :: Apache Software License",
            "Programming Language :: Python :: 3",
            "Programming Language :: Python :: 3.10",
            "Programming Language :: Python :: 3.11",
            "Programming Language :: Python :: 3.12",
            "Topic :: Software Development :: Libraries",
            "Topic :: Scientific/Engineering :: Artificial Intelligence",
          ]
          dependencies = [
            "anthropic>=0.40.0",
          ]

          [project.optional-dependencies]
          dev = [
            "pytest>=8.0.0",
            "ruff>=0.6.0",
            "mypy>=1.11.0",
          ]

          [tool.setuptools]
          package-dir = {"" = "src"}

          [tool.setuptools.packages.find]
          where = ["src"]

          [tool.pytest.ini_options]
          testpaths = ["tests"]
          pythonpath = ["src"]

          [tool.ruff]
          line-length = 100
          target-version = "py310"
          EOF

          cat > .gitignore <<'EOF'
          __pycache__/
          *.py[cod]
          *.egg-info/
          .venv/
          venv/
          .pytest_cache/
          .mypy_cache/
          .ruff_cache/
          build/
          dist/
          .coverage
          htmlcov/
          .DS_Store
          .env
          .env.*
          EOF

          cat > README.md <<'EOF'
          # Anthropic Claude Contributions

          A lightweight Python project for building Claude-powered integrations, prompt helpers, and reusable AI workflows.

          ## Why this project exists

          This repository fills a practical gap in the ecosystem: many developers want to build with Claude in Python, but they need a simple foundation for:

          - API client setup
          - prompt composition
          - configuration handling
          - secure credential management
          - reusable AI integration patterns

          ## Installation

          ```bash
          pip install anthropic-claude-contributions
          ```

          ## Quick start

          ```python
          from anthropic_claude_contributions import ClaudeClient, ClaudeClientConfig

          config = ClaudeClientConfig(
              model="claude-3-5-sonnet-20241022",
              api_key="your_api_key_here",
              max_tokens=500,
          )

          client = ClaudeClient(config)
          result = client.create_message(
              prompt="Summarize this issue in 3 bullet points.",
              system_prompt="You are a concise technical assistant.",
          )
          print(result)
          ```

          ## Development

          ```bash
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q
          ```

          ## Contributing

          Please read [CONTRIBUTING.md](CONTRIBUTING.md) before opening issues or pull requests.

          ## License

          This project is licensed under the Apache License 2.0.
          EOF

          cat > CONTRIBUTING.md <<'EOF'
          # Contributing

          Thank you for helping improve this project.

          ## Ways to contribute

          - bug fixes
          - documentation updates
          - examples and tutorials
          - prompt improvements
          - client improvements

          ## Workflow

          1. Fork the repository
          2. Create a branch
          3. Make a focused change
          4. Add tests
          5. Submit a pull request
          EOF

          cat > SECURITY.md <<'EOF'
          # Security Policy

          Please report vulnerabilities privately to the maintainer.
          EOF

          cat > CHANGELOG.md <<'EOF'
          # Changelog

          ## [0.1.0] - 2026-10-07

          - Initial project setup
          EOF

          cat > src/anthropic_claude_contributions/__init__.py <<'EOF'
          \"\"\"Utilities and helpers for Claude-powered applications.\"\"\"

          from .client import ClaudeClient, ClaudeClientConfig, build_message_prompt

          __all__ = ["ClaudeClient", "ClaudeClientConfig", "build_message_prompt"]
          __version__ = "0.1.0"
          EOF

          cat > src/anthropic_claude_contributions/client.py <<'EOF'
          from __future__ import annotations

          import os
          from dataclasses import dataclass
          from typing import Any

          def build_message_prompt(
              user_prompt: str,
              system_prompt: str | None = None,
              examples: list[dict[str, str]] | None = None,
          ) -> str:
              if not user_prompt or not user_prompt.strip():
                  raise ValueError("user_prompt must not be empty.")

              blocks: list[str] = []
              if system_prompt and system_prompt.strip():
                  blocks.append(f"System:\n{system_prompt.strip()}")

              if examples:
                  example_lines = []
                  for index, example in enumerate(examples, start=1):
                      prompt = example.get("prompt", "").strip()
                      response = example.get("response", "").strip()
                      if prompt and response:
                          example_lines.append(f"Example {index}:\nPrompt: {prompt}\nResponse: {response}")
                  if example_lines:
                      blocks.append("Examples:\n" + "\n\n".join(example_lines))

              blocks.append(f"User:\n{user_prompt.strip()}")
              return "\n\n".join(blocks)

          @dataclass
          class ClaudeClientConfig:
              model: str = "claude-3-5-sonnet-20241022"
              api_key: str | None = None
              max_tokens: int = 1024
              base_url: str | None = None

              @classmethod
              def from_env(cls) -> "ClaudeClientConfig":
                  return cls(
                      api_key=os.getenv("ANTHROPIC_API_KEY"),
                      model=os.getenv("ANTHROPIC_MODEL", "claude-3-5-sonnet-20241022"),
                      max_tokens=int(os.getenv("ANTHROPIC_MAX_TOKENS", "1024")),
                      base_url=os.getenv("ANTHROPIC_BASE_URL"),
                  )

          class ClaudeClient:
              def __init__(self, config: ClaudeClientConfig | None = None):
                  self.config = config or ClaudeClientConfig.from_env()
                  self._client: Any | None = None

              def get_client(self) -> Any:
                  if self._client is not None:
                      return self._client

                  try:
                      from anthropic import Anthropic
                  except ImportError as exc:
                      raise RuntimeError("Install anthropic first: pip install anthropic") from exc

                  api_key = self.config.api_key or os.getenv("ANTHROPIC_API_KEY")
                  if not api_key:
                      raise ValueError("ANTHROPIC_API_KEY is required.")

                  self._client = Anthropic(api_key=api_key, base_url=self.config.base_url)
                  return self._client

              def create_message(self, prompt: str, system_prompt: str | None = None, **kwargs: Any) -> Any:
                  client = self.get_client()
                  return client.messages.create(
                      model=kwargs.pop("model", self.config.model),
                      max_tokens=kwargs.pop("max_tokens", self.config.max_tokens),
                      system=system_prompt,
                      messages=[{"role": "user", "content": prompt}],
                      **kwargs,
                  )
          EOF

          cat > tests/test_client.py <<'EOF'
          from anthropic_claude_contributions import ClaudeClient, ClaudeClientConfig, build_message_prompt

          def test_build_message_prompt_includes_system_and_user():
              result = build_message_prompt(
                  user_prompt="Summarize this document.",
                  system_prompt="You are a concise technical assistant.",
                  examples=[{"prompt": "Explain AI.", "response": "AI is the simulation of intelligence."}],
              )

              assert "System:" in result
              assert "User:" in result
              assert "Summarize this document." in result

          def test_config_reads_from_environment(monkeypatch):
              monkeypatch.setenv("ANTHROPIC_API_KEY", "test-key")
              monkeypatch.setenv("ANTHROPIC_MODEL", "claude-3-5-sonnet")
              monkeypatch.setenv("ANTHROPIC_MAX_TOKENS", "2048")
              config = ClaudeClientConfig.from_env()
              assert config.api_key == "test-key"
              assert config.model == "claude-3-5-sonnet"
              assert config.max_tokens == 2048

          def test_client_requires_api_key(monkeypatch):
              monkeypatch.delenv("ANTHROPIC_API_KEY", raising=False)
              client = ClaudeClient(ClaudeClientConfig(api_key=None))
              try:
                  client.get_client()
              except ValueError:
                  return
              raise AssertionError("Expected ValueError when API key is missing.")
          EOF

          cat > .github/workflows/ci.yml <<'EOF'
          name: CI

          on:
            push:
              branches: [main]
            pull_request:

          jobs:
            test:
              runs-on: ubuntu-latest
              strategy:
                fail-fast: false
                matrix:
                  python-version: ["3.10", "3.11", "3.12"]

              steps:
                - name: Check out repository
                  uses: actions/checkout@v4

                - name: Set up Python
                  uses: actions/setup-python@v5
                  with:
                    python-version: ${{ matrix.python-version }}

                - name: Install dependencies
                  run: |
                    python -m pip install --upgrade pip
                    pip install -e ".[dev]"

                - name: Run tests
                  run: pytest -q
          EOF

      - name: Commit and push changes
        run: |
          git add .
          git commit -m "Initialize open-source Claude toolkit structure" || echo "No changes to commit"
          git push origin main
